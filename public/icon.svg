<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="keyBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283048"/>
      <stop offset="100%" stop-color="#101420"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8db4ff"/>
      <stop offset="100%" stop-color="#3c5ab4"/>
    </linearGradient>
    <linearGradient id="keyDish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2234"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
    <linearGradient id="slothFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2b27e"/>
      <stop offset="100%" stop-color="#b47e4e"/>
    </linearGradient>
    <linearGradient id="slothMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8ee"/>
      <stop offset="100%" stop-color="#f8ebda"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#8db4ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#050810" flood-opacity="0.65"/>
    </filter>
    <filter id="zGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#8db4ff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Keycap Base with Shadow & Border Glow -->
  <rect x="36" y="32" width="440" height="440" rx="96" fill="url(#keyBase)" filter="url(#dropShadow)" stroke="url(#borderGlow)" stroke-width="8"/>

  <!-- Keycap Dish (Inner Surface) -->
  <rect x="64" y="56" width="384" height="364" rx="72" fill="url(#keyDish)" stroke="#2e3854" stroke-width="3"/>
  <path d="M 120 62 L 392 62" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.18"/>

  <!-- Sloth Head Base -->
  <ellipse cx="256" cy="244" rx="138" ry="122" fill="url(#slothFur)"/>

  <!-- Cream Face Mask -->
  <ellipse cx="224" cy="218" rx="60" ry="52" fill="url(#slothMask)"/>
  <ellipse cx="288" cy="218" rx="60" ry="52" fill="url(#slothMask)"/>
  <ellipse cx="256" cy="255" rx="106" ry="60" fill="url(#slothMask)"/>
  <ellipse cx="256" cy="283" rx="80" ry="63" fill="url(#slothMask)"/>

  <!-- Eye Patches (Angled Chocolate Stripes) -->
  <ellipse cx="200" cy="250" rx="28" ry="46" fill="#4a2e1b" transform="rotate(-28 200 250)"/>
  <ellipse cx="312" cy="250" rx="28" ry="46" fill="#4a2e1b" transform="rotate(28 312 250)"/>

  <!-- Happy Sleepy Curved Eyes -->
  <path d="M 184 248 Q 200 230 216 248" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 296 248 Q 312 230 328 248" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="170" cy="283" rx="16" ry="11" fill="#f87171" opacity="0.55"/>
  <ellipse cx="342" cy="283" rx="16" ry="11" fill="#f87171" opacity="0.55"/>

  <!-- Button Nose -->
  <ellipse cx="256" cy="280" rx="20" ry="14" fill="#28140a"/>
  <ellipse cx="251" cy="273" rx="5" ry="3" fill="#55321c"/>

  <!-- Gentle Smile -->
  <path d="M 242 301 Q 256 311 270 301" stroke="#28140a" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Keyboard Homing Bump (Tactile Mark) -->
  <rect x="216" y="386" width="80" height="12" rx="6" fill="#8db4ff"/>

  <!-- Floating Zzz (LazyKeys Sleepy Vibe) -->
  <g filter="url(#zGlow)">
    <path d="M 374 86 L 422 86 L 382 134 L 424 134" stroke="url(#zGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 340 136 L 368 136 L 344 166 L 370 166" stroke="url(#zGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>